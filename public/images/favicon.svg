<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16202C" />
      <stop offset="100%" stop-color="#0A0F16" />
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD55" />
      <stop offset="100%" stop-color="#F5BA13" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background badge -->
  <rect width="64" height="64" rx="14" fill="url(#bg-grad)" stroke="#233446" stroke-width="1.5" />
  
  <!-- Mountain Silhouette -->
  <path d="M12 48 L26 30 L36 42 L48 26 L54 48 Z" fill="#223B52" />
  <path d="M26 30 L32 38 L36 34 L48 26 L42 34 L36 42 Z" fill="#7BAFD4" />
  
  <!-- Lightning Bolt -->
  <polygon points="34,10 24,30 32,30 28,48 44,24 35,24" fill="url(#bolt-grad)" filter="url(#glow)" />
</svg>
